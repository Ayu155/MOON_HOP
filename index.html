<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moon Hop - Game 1 Tombol</title>
<style>
    body {
        margin: 0; 
        background: linear-gradient(135deg, #1a0b2e, #4a154b, #2c003e);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        color: #fff; 
        text-align: center; 
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
    }
    #logo-container {
        display: flex;
        justify-content: center;
        gap: 15px;
        padding: 6px;
        background: rgba(0,0,0,0.4);
        backdrop-filter: blur(8px);
    }
    .game-logo {
        width: 38px;
        height: 38px;
        object-fit: cover;
        border-radius: 50%;
        border: 2px solid #ff00cc;
        background: #333;
        box-shadow: 0 0 8px rgba(255, 0, 204, 0.6);
    }
    #ui {
        position: relative;
        z-index: 10;
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(8px);
        padding: 10px 0;
        border-bottom: 2px solid rgba(255, 0, 204, 0.3);
    }
    .stat { display: inline-block; margin: 0 12px; font-size: 16px; font-weight: bold; text-shadow: 0 0 5px rgba(0,229,255,0.6); }
    button {
        background: linear-gradient(135deg, #ff00cc, #3333ff); 
        border: none; 
        color: white; 
        padding: 10px 22px; 
        margin: 4px; 
        border-radius: 30px; 
        font-weight: bold; 
        cursor: pointer; 
        font-size: 14px;
        box-shadow: 0 4px 15px rgba(255, 0, 204, 0.4);
        transition: transform 0.1s, opacity 0.2s;
    }
    button:hover {
        opacity: 0.9;
        transform: scale(1.05);
    }
    button:active {
        transform: scale(0.95);
    }
    canvas { 
        display: block; 
        margin: 15px auto; 
        background: rgba(10, 5, 25, 0.6); 
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), inset 0 0 20px rgba(255, 0, 204, 0.15);
        touch-action: none;
        border: 2px solid rgba(255, 255, 255, 0.1);
    }
    #modal {
        display: none; 
        position: fixed; 
        top: 50%; 
        left: 50%; 
        transform: translate(-50%,-50%);
        background: rgba(15, 5, 30, 0.95); 
        backdrop-filter: blur(15px);
        padding: 30px; 
        border-radius: 25px; 
        border: 2px solid #ff00cc;
        z-index: 100;
        box-shadow: 0 0 40px rgba(255, 0, 204, 0.6);
        max-width: 350px;
        width: 85%;
    }
    #modal h1 { font-size: 26px; margin: 0 0 10px 0; color: #ff00cc; text-shadow: 0 0 10px rgba(255,0,204,0.5); }
    #modal p { font-size: 15px; line-height: 1.5; margin-bottom: 20px; }
</style>
</head>
<body>

<!-- Container Logo -->
<div id="logo-container">
    <img src="WhatsApp Image 2026-07-29 at 12.13.25 (3).jpeg" alt="Logo Moko" class="game-logo" title="Moko Game Development">
    <img src="WhatsApp Image 2026-07-29 at 12.13.25 (2).jpeg" alt="Logo SMKN 1 Sanden" class="game-logo" title="SMKN 1 Sanden Bantul">
    <img src="WhatsApp Image 2026-07-29 at 12.13.25 (4).jpeg" alt="Logo One Sanden" class="game-logo" title="One Sanden Vocational School">
    <img src="WhatsApp Image 2026-07-29 at 12.13.26.jpeg" alt="Logo RPL" class="game-logo" title="Rekayasa Perangkat Lunak">
</div>

<div id="ui">
    <div class="stat">Skor: <span id="score">0</span></div>
    <div class="stat">Level: <span id="level">1</span></div>
    <div class="stat">Rekor: <span id="highscore">0</span></div><br>
    <button id="btn1" onclick="startGame('1p')">🚀 Main Sendiri</button>
    <button id="btn2" onclick="startGame('2p')">👥 Adu Skor 2 Player</button>
    <div style="font-size: 12px; margin-top: 6px; opacity: 0.7;" id="turnInfo">GUNAKAN TOMBOL PANAH (⬅️ ➡️ ⬆️) ATAU GESER LAYAR</div>
</div>

<div id="modal">
    <h1 id="mTitle">Game Over</h1>
    <p id="mDesc">Skor Kamu: 0</p>
    <button onclick="handleBtn()">Main Lagi</button>
</div>

<canvas id="c" width="800" height="450"></canvas>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let audio = null;

function initAudio() {
    if (!audio) {
        audio = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audio.state === 'suspended') {
        audio.resume();
    }
}

function sfx(type){ 
    if (!audio) return;
    try {
        const o = audio.createOscillator(), g = audio.createGain(); 
        o.connect(g); g.connect(audio.destination);
        
        let freq = 600, duration = 0.15;
        if(type === 'jump') { freq = 550; }
        else if(type === 'score') { freq = 880; duration = 0.1; }
        else if(type === 'levelup') { freq = 1100; duration = 0.25; }
        else if(type === 'gameover') { freq = 180; duration = 0.4; }

        o.frequency.value = freq; 
        g.gain.setValueAtTime(0.2, audio.currentTime); 
        g.gain.exponentialRampToValueAtTime(0.01, audio.currentTime + duration);
        o.start(); o.stop(audio.currentTime + duration);
    } catch(e) {}
}

let player = null, platforms = [], stars = [], particles = [], score = 0, level = 1, isRunning = false, mode = '1p', playerTurn = 1, scores2P = [0, 0];
let highScore = localStorage.getItem('moonhop_highscore') || 0;
document.getElementById('highscore').innerText = highScore;

const keys = { left: false, right: false };

class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 6;
        this.vy = (Math.random() - 0.5) * 6;
        this.alpha = 1;
        this.color = color;
        this.size = Math.random() * 3 + 2;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= 0.03;
    }
    draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(this.alpha, 0);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

class Player {
    constructor(){
        this.x = 400; 
        this.y = 350; 
        this.vx = 0;
        this.vy = 0; 
        this.r = 16; 
        this.onGround = false;
    }
    update(){
        this.vy += 0.42; 
        this.y += this.vy;
        
        if (keys.left) {
            this.vx = -5.5;
        } else if (keys.right) {
            this.vx = 5.5;
        } else {
            this.vx *= 0.85; 
        }

        this.x += this.vx;

        if(this.x < this.r) { this.x = this.r; this.vx = 0; }
        if(this.x > 800 - this.r) { this.x = 800 - this.r; this.vx = 0; }

        // Cek jatuh ke bawah / Game Over
        if(this.y > 470){ 
            gameOver();
        }
        
        platforms.forEach(p => {
            if(this.y + this.r >= p.y && this.y + this.r <= p.y + 16 && this.x >= p.x - 5 && this.x <= p.x + p.w + 5 && this.vy > 0){
                if (!p.counted) {
                    this.y = p.y - this.r; 
                    this.vy = 0; 
                    this.onGround = true; 
                    score++; 
                    p.counted = true; 
                    
                    let newLevel = Math.floor(score / 10) + 1;
                    if(newLevel > level) {
                        level = newLevel;
                        sfx('levelup');
                    } else {
                        sfx('score');
                    }
                    
                    // Efek partikel pendaratan
                    for(let i=0; i<6; i++) {
                        particles.push(new Particle(this.x, this.y + this.r, '#00e5ff'));
                    }

                    updateUI(); 
                }
            }
        });
    }
    jump(direction = 0){
        if(this.onGround){ 
            this.vy = -11.5; 
            if(direction !== 0) {
                this.vx = direction * 6.5;
            }
            this.onGround = false; 
            sfx('jump'); 

            for(let i=0; i<6; i++) {
                particles.push(new Particle(this.x, this.y + this.r, '#ff00cc'));
            }
        }
    }
    draw(){
        ctx.shadowColor = '#00e5ff'; 
        ctx.shadowBlur = 15;
        ctx.fillStyle = '#00e5ff'; 
        ctx.beginPath(); 
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2); 
        ctx.fill();
        
        // Kilau kecil di bola (karakter)
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(this.x - 5, this.y - 5, 4, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.shadowBlur = 0;
    }
}

function startGame(m){
    initAudio();
    mode = m; 
    document.getElementById('modal').style.display = 'none';
    
    if(m === '2p' && playerTurn === 2){ 
        score = 0; 
    } else if(m === '1p') {
        score = 0;
    }
    
    player = new Player(); 
    platforms = []; 
    stars = [];
    particles = [];
    level = 1; 
    
    for(let i = 0; i < 6; i++) {
        platforms.push({
            x: Math.random() * 680, 
            y: 400 - i * 75, 
            w: 95, 
            counted: false, 
            dir: (Math.random() > 0.5 ? 1 : -1)
        });
    }
    for(let i = 0; i < 50; i++) {
        stars.push({x: Math.random() * 800, y: Math.random() * 450, size: Math.random() * 2});
    }
    
    isRunning = true; 
    updateUI(); 
}

function gameOver() {
    isRunning = false;
    sfx('gameover');

    if(score > highScore) {
        highScore = score;
        localStorage.setItem('moonhop_highscore', highScore);
        document.getElementById('highscore').innerText = highScore;
    }

    let modal = document.getElementById('modal');
    let mTitle = document.getElementById('mTitle');
    let mDesc = document.getElementById('mDesc');

    if(mode === '1p') {
        mTitle.innerText = "Game Over!";
        mDesc.innerHTML = `Skor Akhir Kamu: <b>${score}</b><br>Level Tercapai: ${level}`;
    } else {
        scores2P[playerTurn - 1] = score;
        if(playerTurn === 1) {
            mTitle.innerText = `Giliran Player 2 Selesai!`;
            mDesc.innerHTML = `Skor Player 1: ${scores2P[0]}<br>Sekarang giliran Player 2. Siap?`;
            playerTurn = 2;
        } else {
            mTitle.innerText = `Hasil Adu Skor 2 Player`;
            let winner = scores2P[0] > scores2P[1] ? "Player 1 Menang! 🏆" : (scores2P[1] > scores2P[0] ? "Player 2 Menang! 🏆" : "Seri! 🤝");
            mDesc.innerHTML = `Skor P1: ${scores2P[0]}<br>Skor P2: ${scores2P[1]}<br><br><b>${winner}</b>`;
            playerTurn = 1;
        }
    }
    modal.style.display = 'block';
}

window.addEventListener('keydown', (e) => {
    initAudio();
    if(!isRunning || !player) return;

    if(e.code === 'ArrowLeft') {
        keys.left = true;
    } else if(e.code === 'ArrowRight') {
        keys.right = true;
    } else if(e.code === 'ArrowUp' || e.code === 'Space') {
        e.preventDefault();
        let dir = keys.left ? -1 : (keys.right ? 1 : 0);
        player.jump(dir);
    }
});

window.addEventListener('keyup', (e) => {
    if(e.code === 'ArrowLeft') {
        keys.left = false;
    } else if(e.code === 'ArrowRight') {
        keys.right = false;
    }
});

let startX = 0, startY = 0;

canvas.addEventListener('touchstart', (e) => {
    initAudio();
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
}, {passive: true});

canvas.addEventListener('touchend', (e) => {
    if(!isRunning || !player) return;
    let diffX = e.changedTouches[0].clientX - startX;
    let diffY = e.changedTouches[0].clientY - startY;

    if(Math.abs(diffX) > Math.abs(diffY)) {
        player.jump(diffX > 0 ? 1 : -1);
    } else {
        player.jump(0);
    }
});

canvas.addEventListener('mousedown', (e) => {
    initAudio();
    startX = e.clientX;
    startY = e.clientY;
});

canvas.addEventListener('mouseup', (e) => {
    if(!isRunning || !player) return;
    let diffX = e.clientX - startX;
    let diffY = e.clientY - startY;

    if(Math.abs(diffX) > Math.abs(diffY)) {
        player.jump(diffX > 0 ? 1 : -1);
    } else {
        player.jump(0);
    }
});

function update(){
    if(!isRunning || !player) return;
    player.update();
    
    let platformSpeed = 1.6 + (level - 1) * 0.35;
    platforms.forEach(p => {
        p.y += platformSpeed;
        
        // Platform bergerak horizontal mulai level 3 ke atas
        if(level >= 3) {
            p.x += p.dir * (1 + level * 0.1);
            if(p.x < 0 || p.x > 800 - p.w) p.dir *= -1;
        }

        if(p.y > 450){ 
            p.y = -20; 
            p.x = Math.random() * 680; 
            p.counted = false; 
            p.dir = Math.random() > 0.5 ? 1 : -1;
        }
    });

    particles.forEach((pt, index) => {
        pt.update();
        if(pt.alpha <= 0) particles.splice(index, 1);
    });
}

function draw(){
    ctx.clearRect(0, 0, 800, 450);
    
    // Background bintang
    stars.forEach(s => {
        ctx.fillStyle = 'rgba(255,255,255,0.8)'; 
        ctx.fillRect(s.x, s.y, s.size, s.size);
    });
    
    // Planet/Bulan di latar belakang bawah
    ctx.fillStyle = 'rgba(100, 50, 150, 0.25)'; 
    ctx.beginPath(); 
    ctx.arc(400, 480, 180, 0, Math.PI * 2); 
    ctx.fill();
    
    // Gambar Partikel
    particles.forEach(pt => pt.draw());

    // Gambar Platform
    platforms.forEach(p => {
        ctx.shadowColor = '#ff00cc';
        ctx.shadowBlur = 8;
        ctx.fillStyle = '#ff69b4'; 
        ctx.fillRect(p.x, p.y, p.w, 14);
        ctx.shadowBlur = 0;
    });
    
    if(player) player.draw();
}

function loop(){ 
    update(); 
    draw(); 
    requestAnimationFrame(loop); 
}

requestAnimationFrame(loop);

function updateUI(){
    document.getElementById('score').innerText = score;
    document.getElementById('level').innerText = level;
    if(mode === '2p') {
        document.getElementById('turnInfo').innerText = `GILIRAN: PLAYER ${playerTwinText()}`;
    }
}

function playerTwinText() {
    return playerTurn;
}

function handleBtn(){ 
    startGame(mode); 
}
</script>
</body>
</html>
