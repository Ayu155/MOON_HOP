<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moon Hop - Game 1 Tombol</title>
<style>
    body {
        margin: 0; 
        background: linear-gradient(135deg, #ff69b4, #8a2be2);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        color: #fff; 
        text-align: center; 
        overflow: hidden;
    }
    #logo-container {
        display: flex;
        justify-content: center;
        gap: 15px;
        padding: 8px;
        background: rgba(0,0,0,0.3);
    }
    .game-logo {
        width: 40px;
        height: 40px;
        object-fit: cover;
        border-radius: 50%;
        border: 2px solid #ff00cc;
        background: #333;
    }
    #ui {
        position: relative;
        z-index: 10;
        background: rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(5px);
        padding: 10px 0;
    }
    .stat { display: inline-block; margin: 0 15px; font-size: 18px; font-weight: bold; }
    button {
        background: linear-gradient(135deg, #ff00cc, #3333ff); 
        border: none; 
        color: white; 
        padding: 10px 20px; 
        margin: 5px; 
        border-radius: 30px; 
        font-weight: bold; 
        cursor: pointer; 
        font-size: 15px;
        position: relative;
        z-index: 20;
    }
    button:hover {
        opacity: 0.9;
    }
    canvas { 
        display: block; 
        margin: 0 auto; 
        background: rgba(0, 0, 0, 0.3); 
        cursor: pointer;
    }
    #modal {
        display: none; 
        position: fixed; 
        top: 50%; 
        left: 50%; 
        transform: translate(-50%,-50%);
        background: rgba(0, 0, 0, 0.95); 
        padding: 30px; 
        border-radius: 25px; 
        border: 2px solid #ff00cc;
        z-index: 100;
    }
    #modal h1 { font-size: 30px; margin: 0 0 10px 0; }
</style>
</head>
<body>

<!-- Container Logo dengan Gambar Asli -->
<div id="logo-container">
    <img src="WhatsApp Image 2026-07-29 at 12.13.25 (3).jpeg" alt="Logo Moko" class="game-logo" title="Moko Game Development">
    <img src="WhatsApp Image 2026-07-29 at 12.13.25 (2).jpeg" alt="Logo SMKN 1 Sanden" class="game-logo" title="SMKN 1 Sanden Bantul">
    <img src="WhatsApp Image 2026-07-29 at 12.13.25 (4).jpeg" alt="Logo One Sanden" class="game-logo" title="One Sanden Vocational School">
    <img src="WhatsApp Image 2026-07-29 at 12.13.26.jpeg" alt="Logo RPL" class="game-logo" title="Rekayasa Perangkat Lunak">
</div>

<div id="ui">
    <div class="stat">Skor: <span id="score">0</span></div>
    <div class="stat">⏰ <span id="time">30</span>s</div>
    <div class="stat">Level: <span id="level">1</span></div><br>
    <button id="btn1" onclick="startGame('1p')">🚀 Main Sendiri</button>
    <button id="btn2" onclick="startGame('2p')">👥 Adu Skor 2 Player</button>
    <div style="font-size: 13px; margin-top: 5px; opacity: 0.8;">KLIK / TAP LAYAR ATAU TEKAN SPASI UNTUK LOMPAT</div>
</div>

<div id="modal">
    <h1 id="mTitle"></h1>
    <p id="mDesc"></p>
    <button onclick="handleBtn()">Main Lagi</button>
</div>

<canvas id="c" width="800" height="480"></canvas>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let audio = null;

function initAudio() {
    if (!audio) {
        audio = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audio.state === 'suspended') {
        audio.resume();
    }
}

function sfx(f){ 
    if (!audio) return;
    try {
        const o = audio.createOscillator(), g = audio.createGain(); 
        o.connect(g); g.connect(audio.destination);
        o.frequency.value = f; 
        g.gain.setValueAtTime(0.3, audio.currentTime); 
        g.gain.exponentialRampToValueAtTime(0.01, audio.currentTime + 0.15);
        o.start(); o.stop(audio.currentTime + 0.15);
    } catch(e) {}
}

let player = null, platforms = [], stars = [], time = 30, score = 0, level = 1, isRunning = false, mode = '1p', timer, playerTurn = 1, highScore = [0, 0];

class Player{
    constructor(){
        this.x = 400; 
        this.y = 400; 
        this.vy = 0; 
        this.r = 18; 
        this.onGround = false;
    }
    update(){
        this.vy += 0.4; 
        this.y += this.vy;
        if(this.y > 440){ 
            this.y = 440; 
            this.vy = 0; 
            this.onGround = true; 
        }
        
        platforms.forEach(p => {
            if(this.y + this.r > p.y && this.y + this.r < p.y + 18 && this.x > p.x && this.x < p.x + p.w && this.vy > 0){
                this.y = p.y - this.r; 
                this.vy = 0; 
                this.onGround = true; 
                score++; 
                document.getElementById('score').innerText = score;
                
                let calculatedLevel = Math.floor(score / 10) + 1;
                if(calculatedLevel > level){
                    level = calculatedLevel;
                }
                sfx(800);
            }
        });
    }
    jump(){
        if(this.onGround){ 
            this.vy = -11; 
            this.onGround = false; 
            sfx(600); 
        }
    }
    draw(){
        ctx.shadowColor = '#00e5ff'; 
        ctx.shadowBlur = 15;
        ctx.fillStyle = '#00e5ff'; 
        ctx.beginPath(); 
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2); 
        ctx.fill();
        ctx.shadowBlur = 0;
    }
}

function startGame(m){
    initAudio();
    mode = m; 
    document.getElementById('modal').style.display = 'none';
    if(m === '2p' && playerTurn === 2){ score = 0; } 
    
    player = new Player(); 
    platforms = []; 
    stars = [];
    score = 0; 
    level = 1; 
    
    for(let i = 0; i < 5; i++) {
        platforms.push({x: Math.random() * 700, y: 400 - i * 80, w: 90});
    }
    for(let i = 0; i < 40; i++) {
        stars.push({x: Math.random() * 800, y: Math.random() * 480});
    }
    
    time = 30; 
    isRunning = true; 
    updateUI();
    
    clearInterval(timer);
    timer = setInterval(() => {
        time--; 
        document.getElementById('time').innerText = time; 
        if(time <= 0) endGame();
    }, 1000);
}

function triggerJump(e){ 
    initAudio();
    if(isRunning && player) {
        player.jump(); 
    }
}

canvas.addEventListener('click', triggerJump);
window.addEventListener('keydown', (e) => {
    if(e.code === 'Space') {
        e.preventDefault();
        triggerJump();
    }
});

function update(){
    if(!isRunning || !player) return;
    player.update();
    
    platforms.forEach(p => {
        p.y += 1.8 + (level - 1) * 0.4;
        if(p.y > 480){ 
            p.y = -20; 
            p.x = Math.random() * 700; 
        }
    });
}

function draw(){
    ctx.clearRect(0, 0, 800, 480);
    
    stars.forEach(s => {
        ctx.fillStyle = 'white'; 
        ctx.fillRect(s.x, s.y, 2, 2);
    });
    
    ctx.fillStyle = '#555'; 
    ctx.beginPath(); 
    ctx.arc(400, 470, 160, 0, Math.PI * 2); 
    ctx.fill();
    
    platforms.forEach(p => {
        ctx.fillStyle = '#aaa'; 
        ctx.fillRect(p.x, p.y, p.w, 16);
    });
    
    if(player) player.draw();
}

function loop(){ 
    update(); 
    draw(); 
    requestAnimationFrame(loop); 
}

requestAnimationFrame(loop);

function updateUI(){
    document.getElementById('score').innerText = score;
    document.getElementById('level').innerText = level;
    document.getElementById('time').innerText = time;
}

function endGame(){
    clearInterval(timer); 
    isRunning = false; 
    sfx(300);
    let title = document.getElementById('mTitle'), desc = document.getElementById('mDesc');
    
    if(mode === '2p'){
        highScore[playerTurn - 1] = Math.max(highScore[playerTurn - 1], score);
        if(playerTurn === 1){
            playerTurn = 2;
            title.innerText = "Giliran Player 2";
            desc.innerText = `Skor P1: ${score}. Siap?`;
        } else {
            title.innerText = highScore[0] > highScore[1] ? "🏆 PLAYER 1 MENANG! 🏆" : "🏆 PLAYER 2 MENANG! 🏆";
            if(highScore[0] === highScore[1]) title.innerText = "⚖️ SERI! ⚖️";
            desc.innerText = `Skor Akhir: P1=${highScore[0]} | P2=${highScore[1]}`;
            playerTurn = 1;
        }
    } else {
        title.innerText = "Waktu Habis!";
        desc.innerText = `Skor kamu: ${score} (Level ${level})`;
    }
    document.getElementById('modal').style.display = 'block';
}

function handleBtn(){ 
    startGame(mode); 
}
</script>
</body>
</html>
