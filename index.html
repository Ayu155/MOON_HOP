<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moon Hop - Game 1 Tombol</title>
<style>
    body {
        margin:0; background:linear-gradient(#000011, #1a0033);
        font-family:'Segoe UI'; color:#fff; text-align:center; overflow:hidden;
    }
    #ui {
        position:absolute; top:20px; width:100%; z-index:10;
        background:rgba(255,255,255,0.05); backdrop-filter:blur(10px);
        padding:15px 0;
    }
   .stat { display:inline-block; margin:0 25px; font-size:22px; font-weight:bold; }
    button {
        background:linear-gradient(135deg,#ff00cc,#3333ff); border:none; 
        color:white; padding:12px 25px; margin:5px; border-radius:30px; 
        font-weight:bold; cursor:pointer; font-size:16px;
    }
    canvas { display:block; margin:0 auto; }
    #modal {
        display:none; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
        background:rgba(0,0,0,0.9); padding:40px; border-radius:25px; border:2px solid #ff00cc;
    }
    #modal h1 { font-size:40px; margin:0 0 10px 0; }
</style>
</head>
<body>

<div id="ui">
    <div class="stat">Skor: <span id="score">0</span></div>
    <div class="stat">⏰ <span id="time">30</span>s</div>
    <div class="stat">Level: <span id="level">1</span></div><br>
    <button onclick="startGame('1p')">🚀 Main Sendiri</button>
    <button onclick="startGame('2p')">👥 Adu Skor 2 Player</button>
    <p>KLIK / TAP LAYAR UNTUK LOMPAT</p>
</div>

<div id="modal">
    <h1 id="mTitle"></h1>
    <p id="mDesc"></p>
    <button onclick="handleBtn()">Main Lagi</button>
</div>

<canvas id="c" width="800" height="600"></canvas>

<script>
const ctx = document.getElementById('c').getContext('2d');
const audio = new (window.AudioContext || window.webkitAudioContext)();
function sfx(f){ const o=audio.createOscillator(), g=audio.createGain(); o.connect(g);g.connect(audio.destination);
o.frequency.value=f; g.gain.setValueAtTime(0.3,audio.currentTime); g.gain.exponentialRampToValueAtTime(0.01,audio.currentTime+0.15);
o.start();o.stop(audio.currentTime+0.15);}

let player, platforms=[], stars=[], time=30, score=0, level=1, isRunning=false, mode='1p', timer, playerTurn=1, highScore=[0,0];

class Player{
    constructor(){
        this.x=400; this.y=500; this.vy=0; this.r=20; this.onGround=false;
    }
    update(){
        this.vy += 0.4; // gravitasi bulan = ringan
        this.y += this.vy;
        if(this.y > 550){ this.y=550; this.vy=0; this.onGround=true; }
        
        // nabrak platform
        platforms.forEach(p=>{
            if(this.y+this.r>p.y && this.y+this.r<p.y+20 && this.x>p.x && this.x<p.x+100){
                this.y=p.y-this.r; this.vy=0; this.onGround=true; score++; 
                document.getElementById('score').innerText=score;
                sfx(800);
            }
        })
    }
    jump(){
        if(this.onGround){ this.vy=-12; this.onGround=false; sfx(600); }
    }
    draw(){
        ctx.shadowColor='#00e5ff'; ctx.shadowBlur=20;
        ctx.fillStyle='#00e5ff'; ctx.beginPath(); ctx.arc(this.x,this.y,this.r,0,Math.PI*2); ctx.fill();
        ctx.shadowBlur=0;
    }
}

function startGame(m){
    mode=m; document.getElementById('modal').style.display='none';
    if(m==='2p' && playerTurn===2){ score=0; } // reset skor giliran ke-2
    player=new Player(); platforms=[]; stars=[];
    for(let i=0;i<5;i++) platforms.push({x:Math.random()*700, y:500-i*100, w:100});
    for(let i=0;i<50;i++) stars.push({x:Math.random()*800, y:Math.random()*600});
    time=30; score=0; isRunning=true; updateUI();
    
    clearInterval(timer);
    timer=setInterval(()=>{time--; document.getElementById('time').innerText=time; if(time<=0) endGame();},1000);
    loop();
}

function jump(){ if(audio.state==='suspended')audio.resume(); player.jump(); }
document.addEventListener('click', jump);
document.addEventListener('touchstart', jump);

function update(){
    if(!isRunning) return;
    player.update();
    
    // platform naik terus
    platforms.forEach(p=>{
        p.y += 2 + level*0.5;
        if(p.y>600){ p.y=-20; p.x=Math.random()*700; score+=5; }
    })
}

function draw(){
    ctx.clearRect(0,0,800,600);
    // bintang
    stars.forEach(s=>{ctx.fillStyle='white'; ctx.fillRect(s.x,s.y,2,2);});
    // bulan di bawah
    ctx.fillStyle='#666'; ctx.beginPath(); ctx.arc(400,580,200,0,Math.PI*2); ctx.fill();
    
    platforms.forEach(p=>{ctx.fillStyle='#aaa'; ctx.fillRect(p.x,p.y,p.w,20);});
    player.draw();
    document.getElementById('score').innerText=score;
}

function loop(){ update(); draw(); requestAnimationFrame(loop); }

function updateUI(){
    document.getElementById('score').innerText=score;
    document.getElementById('level').innerText=level;
    document.getElementById('time').innerText=time;
}

function endGame(){
    clearInterval(timer); isRunning=false; sfx(300);
    let title=document.getElementById('mTitle'), desc=document.getElementById('mDesc');
    
    if(mode==='2p'){
        highScore[playerTurn-1]=Math.max(highScore[playerTurn-1], score);
        if(playerTurn===1){
            playerTurn=2;
            title.innerText="Giliran Player 2";
            desc.innerText=`Skor P1: ${score}. Siap?`;
        }else{
            title.innerText= highScore[0]>highScore[1] ? "🏆 PLAYER 1 MENANG! 🏆" : "🏆 PLAYER 2 MENANG! 🏆";
            if(highScore[0]===highScore[1]) title.innerText="⚖️ SERI! ⚖️";
            desc.innerText=`Skor Akhir: P1=${highScore[0]} | P2=${highScore[1]}`;
            playerTurn=1;
        }
    }else{
        if(score>level*20){ level++; title.innerText="🎉 LEVEL UP! 🎉"; }
        else{ title.innerText="Waktu Habis!"; }
        desc.innerText=`Skor kamu: ${score}`;
    }
    document.getElementById('modal').style.display='block';
}

function handleBtn(){ startGame(mode); }
</script>
</body>
</html>
